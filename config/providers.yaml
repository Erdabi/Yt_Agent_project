youtube:
  active: stub
  providers:
    stub:
      class: libs.providers.youtube.stub_provider.StubYouTubePublisher
      config: {}
  # Real provider (YouTube Data API v3 — Phase 1/3). There's only one real
  # YouTube, but keeping it behind this interface still lets local dev/tests
  # use the stub instead of touching the real API and its quota. Add
  # libs/providers/youtube/data_api_provider.py subclassing YouTubePublisher,
  # then:
  #   youtube_data_api:
  #     class: libs.providers.youtube.data_api_provider.YouTubeDataAPIPublisher
  #     config: {}
  #     secret_ref: YOUTUBE_OAUTH_CLIENT_SECRET
  # and set active: youtube_data_api.

stock_media:
  active: stub
  providers:
    stub:
      class: libs.providers.stock_media.stub_provider.StubStockMediaProvider
      config: {}
  # Real provider example (Pexels/Pixabay — Phase 1): add
  # libs/providers/stock_media/pexels_provider.py subclassing
  # StockMediaProvider, then:
  #   pexels:
  #     class: libs.providers.stock_media.pexels_provider.PexelsProvider
  #     config: {}
  #     secret_ref: PEXELS_API_KEY
