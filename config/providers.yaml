# Which concrete class backs each swappable capability, and its
# non-secret parameters. Loaded by libs/providers/registry.py (path
# configurable via PROVIDERS_CONFIG_PATH — see .env.example). Switching a
# provider — e.g. Runway for Pika, ElevenLabs for Azure Speech — means
# editing an "active" line below, not a code change
# (docs/architecture/05-technology-choices.md §5.2).
#
# `secret_ref` names an environment variable holding the API key — never
# the key itself, the same convention `provider_configs.secret_ref` uses
# in the database (libs/models/provider.py, libs/schemas doc §4.4).
#
# Every "active" provider below is currently the stub implementation:
# this file's job is to prove the switching mechanism works end to end
# (yaml -> registry -> dynamically-imported, instantiated class), not to
# claim a real vendor integration exists yet. Each capability's
# stub_provider.py raises NotImplementedError honestly instead. Adding a
# real provider is: write the class under libs/providers/<capability>/,
# add an entry for it here, and flip "active" — see the commented example
# under each capability below.
#
# One exception: `editor` (video compositing). Unlike the creative/paid
# vendors above, a compositor needs no vendor account — ffmpeg is a free
# local binary — so its "active" provider is the real, working
# libs.providers.editor.ffmpeg_provider.FFmpegEditorProvider from day
# one, not a stub. `editor` also isn't in libs.models.enums.ProviderCapability
# (no per-channel DB-driven override) — same as `youtube` below, which
# isn't either.
#
# `video_gen` also now has one real, working adapter alongside its
# stub: `runway` (libs/providers/video_gen/runway_provider.py), against
# Runway's public developer API — a genuine paid vendor account is still
# required (RUNWAY_API_KEY), so `active` stays `stub` here until one is
# configured. `invideo` and `veo` remain honest stubs: neither has a
# public API contract this codebase could verify (invideo) or that this
# codebase has real GCP credentials to implement against (veo) — see
# each module's own docstring.
#
# `tts` similarly has one real, working adapter alongside its stub:
# `elevenlabs` (libs/providers/tts/elevenlabs_provider.py), against
# ElevenLabs' public API — `active` stays `stub` here until a real
# ELEVENLABS_API_KEY is configured. `azure_speech` remains an honest
# stub for the same reason as `invideo`/`veo`: no Azure resource exists
# here to implement and verify a real token-based integration against.
#
# Every capability's active provider can also be overridden per-process
# without editing this file at all, via an environment variable named
# `{CAPABILITY}_PROVIDER` — e.g. `VIDEO_GEN_PROVIDER=runway` — read by
# libs/providers/registry.py ahead of the `active:` line below.

video_gen:
  # Stays the default here so the repo boots without any video_gen API
  # key configured — flip this to "runway" (a real, working adapter) once
  # RUNWAY_API_KEY is set, or override per-environment with the
  # VIDEO_GEN_PROVIDER env var (libs/providers/registry.py) without
  # touching this file at all.
  active: stub
  providers:
    stub:
      class: libs.providers.video_gen.stub_provider.StubVideoGenProvider
      config: {}
    # Real, working adapter (libs/providers/video_gen/runway_provider.py)
    # against Runway's public developer API (docs.dev.runwayml.com).
    runway:
      class: libs.providers.video_gen.runway_provider.RunwayProvider
      config:
        model: gen4_turbo
        ratio: "1280:720"
        duration: 5
        poll_interval_sec: 5
        poll_timeout_sec: 300
      secret_ref: RUNWAY_API_KEY
    # Honest stub (libs/providers/video_gen/invideo_provider.py) — no
    # verifiable public API contract exists to implement against yet;
    # see that module's docstring.
    invideo:
      class: libs.providers.video_gen.invideo_provider.InVideoProvider
      config: {}
      secret_ref: INVIDEO_API_KEY
    # Honest stub (libs/providers/video_gen/veo_provider.py) — needs
    # Vertex AI OAuth service-account credentials, not a static API key;
    # see that module's docstring.
    veo:
      class: libs.providers.video_gen.veo_provider.VeoProvider
      config:
        project_id: ""
        location: us-central1
        model: veo-3.0-generate-001
      secret_ref: GOOGLE_VEO_API_KEY

tts:
  # Stays the default here so the repo boots without any tts API key
  # configured — flip this to "elevenlabs" (a real, working adapter)
  # once ELEVENLABS_API_KEY is set, or override per-environment with the
  # TTS_PROVIDER env var (libs/providers/registry.py) without touching
  # this file at all.
  active: stub
  providers:
    stub:
      class: libs.providers.tts.stub_provider.StubTTSProvider
      config: {}
    # Real, working adapter (libs/providers/tts/elevenlabs_provider.py)
    # against ElevenLabs' public API (elevenlabs.io/docs/api-reference).
    elevenlabs:
      class: libs.providers.tts.elevenlabs_provider.ElevenLabsProvider
      config:
        voice_id: "21m00Tcm4TlvDq8ikWAM"  # "Rachel", a commonly-used premade voice
        model_id: eleven_multilingual_v2
        output_format: mp3_44100_128
        max_attempts: 3
        retry_backoff_sec: 2
        timeout_sec: 60
      secret_ref: ELEVENLABS_API_KEY
    # Honest stub (libs/providers/tts/azure_speech_provider.py) — needs a
    # real Azure resource (region + access-token exchange) to implement
    # and verify against; see that module's docstring.
    azure_speech:
      class: libs.providers.tts.azure_speech_provider.AzureSpeechProvider
      config:
        region: eastus
        voice_name: en-US-JennyNeural
      secret_ref: AZURE_SPEECH_API_KEY

image_gen:
  active: stub
  providers:
    stub:
      class: libs.providers.image_gen.stub_provider.StubImageGenProvider
      config: {}
  # Real provider example (Stability AI — Phase 1/4): add
  # libs/providers/image_gen/stability_provider.py subclassing
  # ImageGenProvider, then:
  #   stability:
