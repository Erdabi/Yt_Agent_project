# Which concrete class backs each swappable capability, and its
# non-secret parameters. Loaded by libs/providers/registry.py (path
# configurable via PROVIDERS_CONFIG_PATH — see .env.example). Switching a
# provider — e.g. Runway for Pika, ElevenLabs for Azure Speech — means
# editing an "active" line below, not a code change
# (docs/architecture/05-technology-choices.md §5.2).
#
# `secret_ref` names an environment variable holding the API key — never
# the key itself, the same convention `provider_configs.secret_ref` uses
# in the database (libs/models/provider.py, libs/schemas doc §4.4).
#
# Every "active" provider below is currently the stub implementation:
# this file's job is to prove the switching mechanism works end to end
# (yaml -> registry -> dynamically-imported, instantiated class), not to
# claim a real vendor integration exists yet. Each capability's
# stub_provider.py raises NotImplementedError honestly instead. Adding a
# real provider is: write the class under libs/providers/<capability>/,
# add an entry for it here, and flip "active" — see the commented example
# under each capability below.
#
# One exception: `editor` (video compositing). Unlike the creative/paid
# vendors above, a compositor needs no vendor account — ffmpeg is a free
# local binary — so its "active" provider is the real, working
# libs.providers.editor.ffmpeg_provider.FFmpegEditorProvider from day
# one, not a stub. `editor` also isn't in libs.models.enums.ProviderCapability
# (no per-channel DB-driven override) — same as `youtube` below, which
# isn't either.
#
# `video_gen` also now has two real, working adapters alongside its
# stub: `comfyui` (libs/providers/video_gen/comfyui_provider.py) — a
# local, self-hosted ComfyUI Desktop instance, no API key, no paid
# account, and the default here — and `runway`
# (libs/providers/video_gen/runway_provider.py), against Runway's public
# developer API, for when a genuine paid vendor account is preferred over
# local generation. `invideo` and `veo` remain honest stubs: neither has a
# public API contract this codebase could verify (invideo) or that this
# codebase has real GCP credentials to implement against (veo) — see
# each module's own docstring.
#
# `tts` similarly has two real, working adapters alongside its stub:
# `kokoro` (libs/providers/tts/kokoro_provider.py) — a local, self-hosted
# Kokoro-82M install, no API key, and the default here — and `elevenlabs`
# (libs/providers/tts/elevenlabs_provider.py), against ElevenLabs'
# public API, for a paid-vendor alternative. `azure_speech` remains an
# honest stub for the same reason as `invideo`/`veo`: no Azure resource
# exists here to implement and verify a real token-based integration
# against.
#
# Every capability's active provider can also be overridden per-process
# without editing this file at all, via an environment variable named
# `{CAPABILITY}_PROVIDER` — e.g. `VIDEO_GEN_PROVIDER=runway` — read by
# libs/providers/registry.py ahead of the `active:` line below.

video_gen:
  # Local-first default: ComfyUI Desktop needs no API key/paid account,
  # so it's safe to default to here the way `elevenlabs`/`runway` never
  # could be. Flip to "runway" (a real, working cloud adapter) once
  # RUNWAY_API_KEY is set, or override per-environment with the
  # VIDEO_GEN_PROVIDER env var (libs/providers/registry.py) without
  # touching this file at all.
  active: comfyui
  providers:
    # Real, working adapter (libs/providers/video_gen/comfyui_provider.py)
    # against a local ComfyUI Desktop instance's HTTP API — no vendor
    # account, no API key. Which actual node graph runs is
    # config/comfyui/text_to_video.json (see that directory's README for
    # the placeholder convention and an important caveat: unlike
    # text_to_image.json's stable core-node graph, real text-to-video
    # generation depends entirely on which custom nodes/checkpoint you
    # have installed, so that template is a starting point to replace
    # with your own exported workflow, not a verified one).
    comfyui:
      class: libs.providers.video_gen.comfyui_provider.ComfyUIVideoProvider
      config:
        base_url: http://127.0.0.1:8188
        workflow_template: config/comfyui/text_to_video.json
        width: 1280
        height: 720
        frame_count: 65
        steps: 20
        poll_interval_sec: 3
        poll_timeout_sec: 900
      # No secret_ref: a local ComfyUI instance needs no API key.
    # Real, working adapter (libs/providers/video_gen/runway_provider.py)
    # against Runway's public developer API (docs.dev.runwayml.com).
    runway:
      class: libs.providers.video_gen.runway_provider.RunwayProvider
      config:
        model: gen4_turbo
        ratio: "1280:720"
        duration: 5
        poll_interval_sec: 5
        poll_timeout_sec: 300
      secret_ref: RUNWAY_API_KEY
    stub:
      class: libs.providers.video_gen.stub_provider.StubVideoGenProvider
      config: {}
    # Honest stub (libs/providers/video_gen/invideo_provider.py) — no
    # verifiable public API contract exists to implement against yet;
    # see that module's docstring.
    invideo:
      class: libs.providers.video_gen.invideo_provider.InVideoProvider
      config: {}
      secret_ref: INVIDEO_API_KEY
    # Honest stub (libs/providers/video_gen/veo_provider.py) — needs
    # Vertex AI OAuth service-account credentials, not a static API key;
    # see that module's docstring.
    veo:
      class: libs.providers.video_gen.veo_provider.VeoProvider
      config:
        project_id: ""
        location: us-central1
        model: veo-3.0-generate-001
      secret_ref: GOOGLE_VEO_API_KEY

tts:
  # Local-first default: Kokoro needs no API key/paid account. Flip to
  # "elevenlabs" (a real, working cloud adapter) once ELEVENLABS_API_KEY
  # is set, or override per-environment with the TTS_PROVIDER env var
  # (libs/providers/registry.py) without touching this file at all.
  active: kokoro
  providers:
    # Real, working adapter (libs/providers/tts/kokoro_provider.py)
    # against a local Kokoro-82M install (github.com/hexgrad/kokoro) — no
    # vendor account, no API key, no network call.
    kokoro:
      class: libs.providers.tts.kokoro_provider.KokoroTTSProvider
      config:
        lang_code: a  # American English — see kokoro_provider.py's docstring for other codes
        voice: af_heart
        speed: 1.0
        sample_rate: 24000
      # No secret_ref: a local Kokoro install needs no API key.
    # Real, working adapter (libs/providers/tts/elevenlabs_provider.py)
    # against ElevenLabs' public API (elevenlabs.io/docs/api-reference).
    elevenlabs:
      class: libs.providers.tts.elevenlabs_provider.ElevenLabsProvider
      config:
        voice_id: "21m00Tcm4TlvDq8ikWAM"  # "Rachel", a commonly-used premade voice
        model_id: eleven_multilingual_v2
        output_format: mp3_44100_128
        max_attempts: 3
        retry_backoff_sec: 2
        timeout_sec: 60
      secret_ref: ELEVENLABS_API_KEY
    stub:
      class: libs.providers.tts.stub_provider.StubTTSProvider
      config: {}
    # Honest stub (libs/providers/tts/azure_speech_provider.py) — needs a
    # real Azure resource (region + access-token exchange) to implement
    # and verify against; see that module's docstring.
    azure_speech:
      class: libs.providers.tts.azure_speech_provider.AzureSpeechProvider
      config:
        region: eastus
        voice_name: en-US-JennyNeural
      secret_ref: AZURE_SPEECH_API_KEY

image_gen:
  # Local-first default: ComfyUI Desktop needs no API key/paid account.
  # Override per-environment with the IMAGE_GEN_PROVIDER env var
  # (libs/providers/registry.py) without touching this file at all.
  active: comfyui
  providers:
    # Real, working adapter (libs/providers/image_gen/comfyui_provider.py)
    # against a local ComfyUI Desktop instance's HTTP API — no vendor
    # account, no API key. Which actual node graph runs is
    # config/comfyui/text_to_image.json (core nodes only, no custom node
    # installs needed — see that directory's README).
    comfyui:
      class: libs.providers.image_gen.comfyui_provider.ComfyUIImageProvider
      config:
        base_url: http://127.0.0.1:8188
        workflow_template: config/comfyui/text_to_image.json
        width: 1280
        height: 720
        steps: 20
        poll_interval_sec: 2
        poll_timeout_sec: 300
      # No secret_ref: a local ComfyUI instance needs no API key.
    stub:
      class: libs.providers.image_gen.stub_provider.StubImageGenProvider
      config: {}
  # Real cloud-vendor provider example (Stability AI — Phase 1/4): add
  # libs/providers/image_gen/stability_provider.py subclassing
  # ImageGenProvider, then:
  #   stability:
  #     class: libs.providers.image_gen.stability_provider.StabilityProvider
  #     config: {model: stable-image-ultra}
  #     secret_ref: STABILITY_API_KEY
  # and set active: stability.

youtube:
  # Stays the default here — unlike llm/editor above, publishing to
  # YouTube is a consequential, hard-to-reverse *public* action, not a
  # local computation or a text-only reasoning call. It should require
  # deliberately configuring real OAuth credentials before any real
  # traffic ever flows, so this follows the video_gen/tts convention
  # (stay "stub" until a real credential exists) rather than llm/editor's.
  # Flip to "youtube_data_api" once YOUTUBE_OAUTH_CLIENT_ID,
  # YOUTUBE_OAUTH_CLIENT_SECRET, and YOUTUBE_OAUTH_REFRESH_TOKEN are all
  # set, or override per-environment with YOUTUBE_PROVIDER without
  # touching this file at all.
  active: stub
  providers:
    stub:
      class: libs.providers.youtube.stub_provider.StubYouTubeProvider
      config: {}
    # Real, working adapter (libs/providers/youtube/youtube_data_api_provider.py)
    # against the YouTube Data API v3 — OAuth2 refresh-token flow,
    # resumable upload, thumbnail/playlist/verify. There's only one real
    # YouTube, but this still stays behind the same provider interface so
    # local dev/tests can use the stub instead of touching the real API
    # and its quota.
    youtube_data_api:
      class: libs.providers.youtube.youtube_data_api_provider.YouTubeDataAPIProvider
      config:
        # Env var *names* (not values) for the two OAuth credentials that
        # don't fit the registry's single secret_ref slot below — see
        # youtube_data_api_provider.py's docstring.
        client_id_env_var: YOUTUBE_OAUTH_CLIENT_ID
        refresh_token_env_var: YOUTUBE_OAUTH_REFRESH_TOKEN
        max_attempts: 3
        retry_backoff_sec: 2
        request_timeout_sec: 30
        upload_timeout_sec: 600
        dry_run: false
      # The client *secret* — the one slot this registry mechanism gives
      # every provider. Client id and refresh token are read directly from
      # the environment (names above), never through this mechanism.
      secret_ref: YOUTUBE_OAUTH_CLIENT_SECRET

stock_media:
  active: stub
  providers:
    stub:
      class: libs.providers.stock_media.stub_provider.StubStockMediaProvider
      config: {}
  # Real provider example (Pexels/Pixabay — Phase 1): add
  # libs/providers/stock_media/pexels_provider.py subclassing
  # StockMediaProvider, then:
  #   pexels:
  #     class: libs.providers.stock_media.pexels_provider.PexelsProvider
  #     config: {}
  #     secret_ref: PEXELS_API_KEY
  # and set active: pexels.

audio_library:
  active: stub
  providers:
    stub:
      class: libs.providers.audio_library.stub_provider.StubAudioLibraryProvider
      config: {}
  # Real provider example (Epidemic Sound/Freesound — Phase 1): add
  # libs/providers/audio_library/freesound_provider.py subclassing
  # AudioLibraryProvider, then:
  #   freesound:
  #     class: libs.providers.audio_library.freesound_provider.FreesoundProvider
  #     config: {}
  #     secret_ref: FREESOUND_API_KEY
  # and set active: freesound.

editor:
  active: ffmpeg
  providers:
    ffmpeg:
      class: libs.providers.editor.ffmpeg_provider.FFmpegEditorProvider
      config:
        font_path: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
        audio_bitrate: 128k
        # Per-subprocess-call budget (not a whole-render budget) — see
        # FFmpegEditorProvider's own docstring.
        ffmpeg_timeout_sec: 300
        # Linear gain applied to a whole-video background-music bed so
        # it sits under narration rather than competing with it.
        background_music_volume: 0.18
      # Resolution/fps/crossfade duration/loudness target/subtitle sizing
      # are no longer configured here — they're profile-driven (see
      # config/render_profiles.yaml, libs/providers/editor/profiles.py),
      # so a different output format never touches this file.
    stub:
      class: libs.providers.editor.stub_provider.StubEditorProvider
      config: {}
  # No secret_ref: ffmpeg needs no API key. A future alternative
  # compositor (e.g. a Remotion-based service, docs/architecture/
  # 05-technology-choices.md §5.2) would slot in the same way every other
  # capability's real provider does — a new class + entry here, "active"
  # flipped, nothing in services/agent_video/app/modules/rendering.py
  # touched.

llm:
  # Local-first default: a local Ollama install needs no API key/paid
  # account, unlike every cloud vendor below — every reasoning call site
  # in this codebase (Research's IdeaGenerator/KnowledgeBuilder, the
  # Script Agent's ScriptGenerator/ScriptReviewer, the Manager's
  # reasoning engine, the Thumbnail Agent's ThumbnailConceptGenerator,
  # the Quality Control Agent's reviewers) routes through
  # `libs.providers.get_provider("llm")`, never a hardcoded vendor SDK
  # import, so this is a one-line switch away from Anthropic (or a
  # future OpenAI provider) rather than a code change anywhere.
  active: ollama
  providers:
    # Real, working adapter (libs/providers/llm/ollama_provider.py)
    # against a local Ollama install (ollama.com) — no vendor account,
    # no API key, no network call beyond localhost.
    ollama:
      class: libs.providers.llm.ollama_provider.OllamaLLMProvider
      # model/base_url default to OLLAMA_MODEL/OLLAMA_URL
      # (libs/core/config.py) when omitted here.
      config: {}
      # No secret_ref: a local Ollama install needs no API key.
    # Real, working adapter (libs/providers/llm/anthropic_provider.py)
    # against the Anthropic API, for a paid-vendor alternative to local
    # inference (e.g. Research's KnowledgeBuilder needs Anthropic's
    # server-side web_search/web_fetch tools for genuinely *verified*
    # facts — see generate_tool_call's enable_web_research docstring in
    # libs/providers/llm/base.py — since no local model here has an
    # equivalent web-research capability).
    anthropic:
      class: libs.providers.llm.anthropic_provider.AnthropicLLMProvider
      # model/effort default to ANTHROPIC_MODEL/ANTHROPIC_EFFORT
      # (libs/core/config.py) when omitted here.
      config: {}
      secret_ref: ANTHROPIC_API_KEY
    stub:
      class: libs.providers.llm.stub_provider.StubLLMProvider
      config: {}
  # Real provider example (OpenAI GPT — the documented fallback in
  # docs/architecture/05-technology-choices.md §5.2): add
  # libs/providers/llm/openai_provider.py subclassing LLMProvider, then:
  #   openai:
  #     class: libs.providers.llm.openai_provider.OpenAIProvider
  #     config: {model: gpt-5}
  #     secret_ref: OPENAI_API_KEY
  # and set active: openai (or LLM_PROVIDER=openai per-environment).
