audio_library:
  active: stub
  providers:
    stub:
      class: libs.providers.audio_library.stub_provider.StubAudioLibraryProvider
      config: {}
  # Real provider example (Epidemic Sound/Freesound — Phase 1): add
  # libs/providers/audio_library/freesound_provider.py subclassing
  # AudioLibraryProvider, then:
  #   freesound:
  #     class: libs.providers.audio_library.freesound_provider.FreesoundProvider
  #     config: {}
  #     secret_ref: FREESOUND_API_KEY
  # and set active: freesound.

editor:
  active: ffmpeg
  providers:
    ffmpeg:
      class: libs.providers.editor.ffmpeg_provider.FFmpegEditorProvider
      config:
        fps: 30
        font_path: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
        crossfade_sec: 0.5
        audio_bitrate: 128k
    stub:
      class: libs.providers.editor.stub_provider.StubEditorProvider
      config: {}
  # No secret_ref: ffmpeg needs no API key. A future alternative
  # compositor (e.g. a Remotion-based service, docs/architecture/
  # 05-technology-choices.md §5.2) would slot in the same way every other
  # capability's real provider does — a new class + entry here, "active"
  # flipped, nothing in services/agent_video/app/modules/rendering.py
  # touched.
