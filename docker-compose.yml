      context: .
      dockerfile: services/agent_scriptwriter/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=agent_scriptwriter
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agent_storyboard:
