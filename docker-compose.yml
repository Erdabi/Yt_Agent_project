
# Single-VPS deployment stack (see docs/architecture/01-system-architecture.md
# §1.6). Every service shares the repo root as its build context so it can
# pull in libs/ and requirements/base.txt alongside its own code — see the
# comment atop each Dockerfile.
#
# Deliberately not included yet, because nothing in this codebase uses them:
#   - MinIO/object storage — no agent produces a real media artifact yet.
#   - Celery beat (the scheduler) — no periodic job exists to schedule until
#     the Research Agent's ideation logic lands (Phase 1).
#   - Caddy/reverse proxy — there is no dashboard to put behind TLS yet
#     (Phase 2).
# Add each when the thing it would front or run actually exists.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: brings the schema to head, then exits. Every other service
  # that touches Postgres waits on this one completing successfully rather
  # than running migrations itself, so "which container runs the migration"
  # is never ambiguous.
  migrate:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      - SERVICE_NAME=migrate
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - SERVICE_NAME=orchestrator
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agent_research:
    build:
      context: .
      dockerfile: services/agent_research/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=agent_research
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agent_scriptwriter:
