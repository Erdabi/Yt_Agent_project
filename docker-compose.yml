
# Single-VPS deployment stack (see docs/architecture/01-system-architecture.md
# §1.6). Every service shares the repo root as its build context so it can
# pull in libs/ and requirements/base.txt alongside its own code — see the
# comment atop each Dockerfile.
#
# Deliberately not included yet, because nothing in this codebase uses them:
#   - MinIO/object storage — the centralized asset storage abstraction
#     (libs/storage) currently only ships a local-filesystem backend; add
#     a MinIO service + backend when a real media-producing agent needs
#     durable object storage beyond one VPS's disk.
#   - Caddy/reverse proxy — there is no dashboard to put behind TLS yet
#     (Phase 2).
# Add each when the thing it would front or run actually exists.
#
# `agent_analytics_beat` below is this stack's one Celery beat process —
# it exists specifically because Analytics is the only agent that runs on
# its own recurring schedule rather than being dispatched by the Manager.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: brings the schema to head, then exits. Every other service
  # that touches Postgres waits on this one completing successfully rather
  # than running migrations itself, so "which container runs the migration"
  # is never ambiguous.
  migrate:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      - SERVICE_NAME=migrate
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - SERVICE_NAME=orchestrator
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The Manager Agent's own worker process — consumes the `manager` queue
  # that every agent notifies on completion (see
  # libs/agents/base.py:BaseAgent._notify_manager). Built from the same
  # image as `orchestrator` (same code, same dependencies including the
  # Anthropic SDK) with a different command, exactly like `migrate` above.
  manager_worker:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    command: ["celery", "-A", "app.manager.tasks:celery_app", "worker", "--loglevel=info", "-Q", "manager", "--concurrency=2"]
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=manager_worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agent_research:
    build:
      context: .
      dockerfile: services/agent_research/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=agent_research
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agent_scriptwriter:
    build:
      context: .
      dockerfile: services/agent_scriptwriter/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=agent_scriptwriter
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Replaces what used to be four separate services (agent_storyboard,
  # agent_voiceover, agent_video_assembly, agent_thumbnail) — those are now
  # internal modules of one Video Agent, run as a single job on the `video`
  # queue (see services/agent_video/app/video_agent.py).
  agent_video:
    build:
      context: .
      dockerfile: services/agent_video/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=agent_video
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agent_qa:
    build:
      context: .
      dockerfile: services/agent_qa/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=agent_qa
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agent_publisher:
    build:
      context: .
      dockerfile: services/agent_publisher/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=agent_publisher
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The worker half: consumes the `analytics` queue, same as every other
  # agent. Never dispatched by the Manager — see
  # services/agent_analytics/app/worker.py for why.
  agent_analytics:
    build:
      context: .
      dockerfile: services/agent_analytics/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=agent_analytics
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The scheduler half: same image as `agent_analytics` above, running
  # `celery beat` instead of `celery worker` — exactly the orchestrator/
  # manager_worker split, applied here. This is what actually fires
  # `agents.analytics.sweep` on the ANALYTICS_SWEEP_INTERVAL_HOURS cadence;
  # without this service the analytics queue would sit idle forever since
  # nothing else ever enqueues that task. Beat's own schedule-tracking file
  # is not volume-backed — a restart just re-reads the in-code schedule and
  # resumes on the same cadence, at most delaying one sweep, which is an
  # acceptable trade for not adding a volume for a single timestamp file.
  agent_analytics_beat:
    build:
      context: .
      dockerfile: services/agent_analytics/Dockerfile
    command: ["celery", "-A", "app.worker:celery_app", "beat", "--loglevel=info"]
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=agent_analytics_beat
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
