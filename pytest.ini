[pytest]
# Every service's app package is literally named "app" (see each
# Dockerfile's WORKDIR /app), so tests importing a specific service's
# routes need that service's own directory on sys.path alongside the
# repo root (for libs.*) — pytest's built-in pythonpath option adds both
# before any test module or conftest.py is collected.
pythonpath =
    .
    services/orchestrator
testpaths = tests
