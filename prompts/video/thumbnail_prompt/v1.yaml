template: |
  Generate an image-generation prompt for a YouTube thumbnail for the video
  titled "{{ video_title }}".

  Channel style guide: {{ style_guide_summary }}
  {% if emphasis_words %}Emphasize these words/concepts visually: {{ emphasis_words | join(", ") }}
  {% endif %}
  The result should be a single, concrete prompt suitable for an image
  generation provider — describe composition, subject, mood, and color
  palette explicitly.
metadata:
  description: >
    Prompt for the Video Agent's Thumbnail Generation module
    (docs/architecture/03-agent-responsibilities.md §3.4,
    services/agent_video/app/modules/thumbnail.py). Loaded via
    get_prompt_loader().get("video", "thumbnail_prompt") and rendered
    into an image-gen prompt before checking the Asset Cache and calling
    get_provider("image_gen").
  owner: video-agent
  variables: [video_title, style_guide_summary, emphasis_words]
