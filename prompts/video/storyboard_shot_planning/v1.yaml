template: |
  Plan the visual treatment for this script segment (segment #{{ segment_order_index }}):

  "{{ script_segment_text }}"

  Choose exactly one visual treatment from: {{ available_visual_types | join(", ") }}.
  If choosing stock footage or an AI-generated image/video, also provide the
  search query or generation prompt to use.
metadata:
  description: >
    Draft prompt predating the Script Agent's asset_requirements field
    (libs/schemas/script_production.py). The Video Agent's Asset Planning
    module (services/agent_video/app/modules/asset_planning.py,
    docs/architecture/03-agent-responsibilities.md §3.4.1) is deterministic,
    not LLM-based — the Script Agent already fully specifies each
    segment's visual treatment (asset_type, description) before the
    script is ever persisted, so there's no remaining creative decision
    for a call like this one to make. Left unwired rather than deleted,
    in case a future revision wants Asset Planning to double-check or
    override the Script Agent's own choices via a real Claude call.
  owner: video-agent
  variables: [segment_order_index, script_segment_text, available_visual_types]
