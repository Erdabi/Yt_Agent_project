template: |
  You are scoring candidate YouTube video ideas for the "{{ channel_niche }}" channel.

  Channel persona / tone: {{ channel_persona }}
  {% if banned_topics %}Banned topics (never score these highly, flag instead): {{ banned_topics | join(", ") }}
  {% endif %}
  {% if past_performance_summary %}Recent performance context: {{ past_performance_summary }}
  {% endif %}
  Candidate ideas:
  {% for title in candidate_titles %}{{ loop.index }}. {{ title }}
  {% endfor %}
  For each candidate, provide a confidence score (0-100), target keywords,
  and a one-sentence rationale grounded in the channel's persona and past
  performance. Flag any candidate that duplicates a previously produced
  video's core topic.
metadata:
  description: >
    Draft prompt for the Research Agent's LLM-based idea scoring
    (docs/architecture/03-agent-responsibilities.md §3.2). Not wired into
    real code yet — ResearchAgent.run() still raises NotImplementedError
    (docs/architecture/06-roadmap.md, Phase 1). Ready to load via
    get_prompt_loader().get("research", "idea_scoring") once it is.
  owner: research-agent
  variables: [channel_niche, channel_persona, banned_topics, past_performance_summary, candidate_titles]
