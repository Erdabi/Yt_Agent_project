template: |
  Write a YouTube video script for: "{{ idea_title }}"

  Idea description: {{ idea_description }}
  Channel persona / brand voice: {{ channel_persona }}
  Target duration: {{ target_duration_sec }} seconds
  {% if tone %}Tone: {{ tone }}
  {% endif %}
  Structure the script as hook -> body -> call to action -> outro. Break it
  into timed segments suitable for a storyboard (one segment per distinct
  visual beat). Keep language natural for spoken narration, not prose.
metadata:
  description: >
    Draft prompt for the Script Agent's generation call
    (docs/architecture/03-agent-responsibilities.md §3.3). Not wired into
    real code yet — ScriptwriterAgent.run() still raises
    NotImplementedError (docs/architecture/06-roadmap.md, Phase 1). Ready
    to load via get_prompt_loader().get("script", "generate_script") once
    it is.
  owner: script-agent
  variables: [idea_title, idea_description, channel_persona, target_duration_sec, tone]
